name: Deploy Development

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: messenger-development
  cancel-in-progress: false

jobs:
  test-package-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install EF Core tool
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Build pinned MinIO test image
        run: docker build --tag messenger-minio:RELEASE.2025-10-15T17-29-55Z --file deploy/Dockerfile.minio deploy
      - name: Run complete test suite
        shell: pwsh
        run: ./scripts/test-all.ps1 -Configuration Release
      - name: Package self-contained Linux release
        shell: pwsh
        run: ./scripts/package-linux-release.ps1 -Configuration Release -Output artifacts/deployment -ReleaseId ${{ github.sha }}
      - name: Configure pinned SSH identity
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload and activate release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          archive="artifacts/deployment/messenger-${GITHUB_SHA}.tar.gz"
          remote_archive="/var/lib/messenger-deploy/incoming/messenger-${GITHUB_SHA}.tar.gz"
          scp "$archive" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "sudo /usr/local/sbin/messenger-deploy '${remote_archive}' '${GITHUB_SHA}'"
      - name: Verify public HTTPS health
        run: curl --fail --show-error --silent --retry 12 --retry-delay 5 https://185-56-162-174.sslip.io/health
